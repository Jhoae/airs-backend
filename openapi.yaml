openapi: 3.0.3
info:
  title: AIRS Backend API
  version: v2
  description: AIRS backend API definition for mobile/admin app, sensor ingestion query, and internal AI query.
tags:
  - name: Auth
    description: 회원가입 및 로그인 API
  - name: Campus
    description: 회원가입/등록 화면에서 사용하는 학교/공간 조회 API
  - name: User
    description: 현재 로그인 사용자 정보 API
  - name: Admin Approval
    description: ROOT_ADMIN의 관리자 승인 API
  - name: Admin Nodes
    description: 관리자 앱 노드 목록, 상세, 등록, 삭제 API
  - name: Admin Analytics
    description: 관리자 앱 분석 요약 및 환기/CO2 분석 API
  - name: Sensor
    description: 인증 사용자가 조회하는 센서 요약 API
  - name: Internal Sensor
    description: localhost 내부 AI용 센서 조회 API
paths:
  /actuator/health:
    get:
      tags:
        - Internal Sensor
      summary: Health check
      description: Docker healthcheck, liveness probe, monitoring tool이 인증 없이 호출할 수 있습니다.
      responses:
        '200':
          description: 서버 상태 조회 성공
  /actuator/info:
    get:
      tags:
        - Internal Sensor
      summary: Application info
      description: 인증 없이 호출 가능한 actuator info endpoint입니다.
      responses:
        '200':
          description: 애플리케이션 정보 조회 성공

  /airs/auth/signup:
    post:
      tags:
        - Auth
      summary: 회원가입
      description: USER 또는 ADMIN 계정을 생성합니다. ROOT_ADMIN은 일반 회원가입으로 생성할 수 없습니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: 회원가입 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignUpResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /airs/auth/login:
    post:
      tags:
        - Auth
      summary: 로그인
      description: 이메일/로그인 ID와 비밀번호로 JWT access token을 발급합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /airs/campuses:
    get:
      tags:
        - Campus
      summary: 캠퍼스 목록 조회
      description: 회원가입 화면에서 학교 선택에 사용합니다. 인증이 필요하지 않습니다.
      responses:
        '200':
          description: 캠퍼스 목록 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CampusResponse'

  /airs/users/me:
    get:
      tags:
        - User
      summary: 내 정보 조회
      description: 'Authorization: Bearer {accessToken} 헤더가 필요합니다.'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /airs/admin/admins/{userId}/approve:
    patch:
      tags:
        - Admin Approval
      summary: ADMIN 승인
      description: 승인된 ROOT_ADMIN이 같은 캠퍼스의 미승인 ADMIN을 승인합니다. 이미 승인된 ADMIN이면 같은 응답을 200 OK로 반환합니다.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: ADMIN 승인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminApprovalResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /airs/admin/campuses:
    post:
      tags:
        - Campus
      summary: 관리자용 캠퍼스 등록
      description: 승인된 ADMIN 또는 ROOT_ADMIN만 새 캠퍼스를 추가할 수 있습니다. USER는 호출할 수 없습니다.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreateCampusRequest'
      responses:
        '201':
          description: 캠퍼스 등록 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /airs/admin/campuses/{campusId}/buildings:
    get:
      tags:
        - Campus
      summary: 관리자용 건물 목록 조회
      description: 노드 등록 화면에서 학교 선택 후 건물 목록을 조회합니다. 승인된 ADMIN 또는 ROOT_ADMIN만 호출할 수 있습니다.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CampusId'
      responses:
        '200':
          description: 건물 목록 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminBuildingResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
        - Campus
      summary: 관리자용 건물 등록
      description: 승인된 ADMIN 또는 ROOT_ADMIN이 자신의 캠퍼스에 건물을 추가합니다.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CampusId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreateBuildingRequest'
      responses:
        '201':
          description: 건물 등록 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBuildingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /airs/admin/buildings/{buildingId}/spaces:
    get:
      tags:
        - Campus
      summary: 관리자용 공간 목록 조회
      description: 노드 등록 화면에서 건물 선택 후 공간 목록을 조회합니다. 승인된 ADMIN 또는 ROOT_ADMIN만 호출할 수 있습니다.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BuildingId'
      responses:
        '200':
          description: 공간 목록 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminSpaceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
        - Campus
      summary: 관리자용 공간 등록
      description: 노드 등록 화면의 새 공간 추가 버튼에서 사용합니다. 승인된 ADMIN 또는 ROOT_ADMIN만 자신의 캠퍼스 건물에 공간을 추가할 수 있습니다.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BuildingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreateSpaceRequest'
      responses:
        '201':
          description: 공간 등록 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSpaceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /airs/admin/nodes:
    get:
      tags:
        - Admin Nodes
      summary: 관리자 노드 목록 조회
      description: 관리자 앱 노드 관리 화면을 위한 목록 API입니다. 승인된 ADMIN 또는 ROOT_ADMIN만 호출할 수 있습니다.
      security:
        - bearerAuth: []
      parameters:
        - name: sort
          in: query
          required: false
          description: 노드 목록 정렬 기준
          schema:
            type: string
            enum:
              - distance
              - status
              - space
              - alert
            default: distance
      responses:
        '200':
          description: 노드 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminNodeListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /airs/admin/nodes/{nodeId}:
    get:
      tags:
        - Admin Nodes
      summary: 관리자 노드 상세 조회
      description: 관리자 앱 노드 상세 화면을 위한 API입니다. 승인된 ADMIN 또는 ROOT_ADMIN만 호출할 수 있습니다.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NodeId'
      responses:
        '200':
          description: 노드 상세 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminNodeDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Admin Nodes
      summary: 관리자 노드 삭제
      description: 물리 노드 row를 삭제하지 않고 active installation을 비활성화합니다.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NodeId'
      responses:
        '204':
          description: 노드 삭제 성공
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /airs/admin/nodes/{nodeId}/co2-trend:
    get:
      tags:
        - Admin Nodes
      summary: 관리자 노드 CO2 추이 조회
      description: InfluxDB의 telemetry co2_ppm 시계열을 조회합니다.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NodeId'
        - name: period
          in: query
          required: false
          description: 장기 CO2 그래프 조회 기간입니다. period가 있으면 hours/window 대신 기간별 기본 window를 사용합니다.
          schema:
            type: string
            enum:
              - 1d
              - 5d
              - 1mo
              - 6mo
              - 1y
            example: 5d
        - name: hours
          in: query
          required: false
          description: period가 없을 때 사용하는 최근 조회 시간입니다.
          schema:
            type: integer
            minimum: 1
            maximum: 24
            default: 6
        - name: window
          in: query
          required: false
          description: 'Flux aggregateWindow 간격입니다. 예: 30s, 1m, 5m, 1h'
          schema:
            type: string
            default: 5m
            example: 5m
      responses:
        '200':
          description: CO2 추이 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminNodeCo2TrendResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /airs/admin/analytics/co2:
    get:
      tags:
        - Admin Analytics
      summary: 관리자 환기/CO2 분석 조회
      description: 환기/CO2 분석 화면의 CO2 현황 탭을 위한 API입니다. 현재 공간별 상태는 MySQL snapshot에서, 시간대별 평균 추이는 InfluxDB co2_ppm에서 조회합니다.
      security:
        - bearerAuth: []
      parameters:
        - name: date
          in: query
          required: false
          description: 조회 기준 날짜입니다. 생략하면 서버 기준 오늘 날짜를 사용합니다.
          schema:
            type: string
            format: date
            example: '2026-07-07'
      responses:
        '200':
          description: 환기/CO2 분석 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCo2AnalyticsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /airs/admin/analytics/overview:
    get:
      tags:
        - Admin Analytics
      summary: 관리자 분석 요약 조회
      description: 분석 요약 화면의 전체 요약 탭을 위한 API입니다. AI 요약, comfort score, 냉방 낭비처럼 아직 기준이 확정되지 않은 값은 null로 반환합니다.
      security:
        - bearerAuth: []
      parameters:
        - name: date
          in: query
          required: false
          description: 조회 기준 날짜입니다. 생략하면 서버 기준 오늘 날짜를 사용합니다.
          schema:
            type: string
            format: date
            example: '2026-07-07'
      responses:
        '200':
          description: 분석 요약 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAnalyticsOverviewResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /airs/admin/nodes/installations:
    post:
      tags:
        - Admin Nodes
      summary: Bluetooth 기반 노드 등록 완료
      description: 앱이 Bluetooth/Wi-Fi 설정 성공을 확인한 뒤 backend에 최종 설치 결과를 저장합니다. Wi-Fi password는 절대 보내지 않습니다.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminNodeRegistrationRequest'
      responses:
        '201':
          description: 새 노드 설치 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminNodeRegistrationResponse'
        '200':
          description: 같은 nodeId와 spaceId의 중복 등록 요청. 기존 설치 결과를 반환합니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminNodeRegistrationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /airs/nodes/{nodeId}/measurements/summary:
    get:
      tags:
        - Sensor
      summary: DHT22 일간 요약 조회
      description: 승인된 ADMIN 또는 ROOT_ADMIN이 자기 캠퍼스 active 노드의 일간 온습도 요약을 조회합니다.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NodeId'
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
            example: 2026-07-02
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyDht22SummaryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /airs/internal/nodes/{nodeId}/measurements/range:
    get:
      tags:
        - Internal Sensor
      summary: AI용 센서 기간 조회
      description: localhost 내부 호출 전용 API입니다. 온도, 습도, CO2 raw 시계열을 조회합니다.
      parameters:
        - $ref: '#/components/parameters/NodeId'
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
            example: 2026-07-02T00:00:00Z
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
            example: 2026-07-02T23:59:59Z
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dht22RangeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Authorization: Bearer {accessToken}'
  parameters:
    NodeId:
      name: nodeId
      in: path
      required: true
      schema:
        type: string
        example: node_01
    CampusId:
      name: campusId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        example: 1
    BuildingId:
      name: buildingId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        example: 1
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        example: 2
  responses:
    BadRequest:
      description: 요청 값이 올바르지 않습니다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Unauthorized:
      description: 인증이 필요하거나 토큰이 유효하지 않습니다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Forbidden:
      description: 접근 권한이 없습니다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    NotFound:
      description: 요청한 리소스를 찾을 수 없습니다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Conflict:
      description: 리소스 상태가 충돌합니다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
  schemas:
    UserRole:
      type: string
      enum:
        - USER
        - ADMIN
        - ROOT_ADMIN
    ConnectionStatus:
      type: string
      enum:
        - ONLINE
        - WEAK
        - OFFLINE
        - UNKNOWN
    OccupancyStatus:
      type: string
      enum:
        - OCCUPIED
        - UNOCCUPIED
        - UNKNOWN
    SpaceType:
      type: string
      enum:
        - CLASSROOM
        - READING_ROOM
        - LAB
        - OFFICE
        - OTHER
    AlertType:
      type: string
      enum:
        - VENTILATION_RECOMMENDED
        - NODE_OFFLINE
        - WEAK_WIFI
        - SENSOR_ABNORMAL
        - INFO
    AlertSeverity:
      type: string
      enum:
        - EMERGENCY
        - WARNING
        - INFO

    SignUpRequest:
      type: object
      required:
        - email
        - password
        - nickname
        - phone
        - campusId
        - role
      properties:
        email:
          type: string
          format: email
          maxLength: 50
          example: user@example.com
        password:
          type: string
          minLength: 8
          maxLength: 30
