          example: 현재 재실
        comfortScore:
          type: number
          nullable: true
          example: 82.0
        comfortSummary:
          type: string
          nullable: true
          example: 쾌적
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/AdminNodeAlertResponse'
    AdminNodeAlertResponse:
      type: object
      properties:
        alertId:
          type: integer
          format: int64
