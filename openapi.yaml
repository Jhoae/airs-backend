openapi: 3.0.3
info:
  title: AIRS Backend API
  version: v2
  description: AIRS backend API definition for mobile/admin app and sensor ingestion query.
servers:
  - url: https://airs.bibnear.cloud
    description: Production API via Caddy HTTPS reverse proxy
  - url: http://localhost:8080
    description: Local development API
tags:
  - name: Auth
    description: 회원가입 및 로그인 API
  - name: Campus
    description: 회원가입/등록 화면에서 사용하는 학교/공간 조회 API
  - name: User
    description: 현재 로그인 사용자 정보 API
  - name: Admin Approval
    description: ROOT_ADMIN의 관리자 승인 API
  - name: Admin Nodes
    description: 관리자 앱 노드 목록, 상세, 등록, 삭제 API
  - name: Admin Alerts
    description: 관리자 앱 알림·조치 목록 및 변화량 기반 경고 API
  - name: Admin Analytics
    description: 관리자 앱 분석 요약 및 환기/CO2 분석 API
  - name: Sensor
    description: 인증 사용자가 조회하는 센서 요약 API
  - name: Health
    description: 배포 상태를 확인하는 무인증 health API
paths:
  /actuator/health:
    get:
      tags:
        - Health
      summary: Health check
      description: Docker healthcheck, liveness probe, monitoring tool이 인증 없이 호출할 수 있습니다.
      responses:
        '200':
          description: 서버 상태 조회 성공
  /actuator/info:
    get:
      tags:
        - Health
      summary: Application info
      description: 인증 없이 호출 가능한 actuator info endpoint입니다.
      responses:
        '200':
          description: 애플리케이션 정보 조회 성공

  /airs/health:
    get:
      tags:
        - Health
      summary: Public health check
      description: Caddy를 거쳐 Spring API에 도달할 수 있는지 확인하는 외부 무인증 endpoint입니다. 데이터베이스, InfluxDB, MQTT 연결 상태까지 검사하지는 않습니다.
      responses:
        '200':
          description: Spring API 응답 가능
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicHealthResponse'

  /airs/auth/signup:
    post:
      tags:
        - Auth
      summary: 회원가입
      description: USER 또는 ADMIN 계정을 생성합니다. ROOT_ADMIN은 일반 회원가입으로 생성할 수 없습니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: 회원가입 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignUpResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /airs/auth/login:
    post:
      tags:
        - Auth
      summary: 로그인
      description: 이메일/로그인 ID와 비밀번호로 JWT access token을 발급합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /airs/campuses:
    get:
      tags:
        - Campus
      summary: 캠퍼스 목록 조회
      description: 회원가입 화면에서 학교 선택에 사용합니다. 인증이 필요하지 않습니다.
      responses:
        '200':
          description: 캠퍼스 목록 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CampusResponse'

  /airs/users/me:
    get:
      tags:
        - User
      summary: 내 정보 조회
      description: 'Authorization: Bearer {accessToken} 헤더가 필요합니다.'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /airs/admin/admins/pending:
    get:
      tags:
        - Admin Approval
      summary: 관리자 승인 대기 목록 조회
      description: 승인된 ROOT_ADMIN이 같은 캠퍼스에서 ADMIN으로 가입했지만 아직 승인되지 않은 사용자 목록을 조회합니다.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 관리자 승인 대기 목록 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminPendingApprovalResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 요청한 캠퍼스를 찾을 수 없거나 삭제되었습니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /airs/admin/admins/{userId}/approve:
    patch:
      tags:
        - Admin Approval
      summary: ADMIN 승인
      description: 승인된 ROOT_ADMIN이 같은 캠퍼스의 PENDING ADMIN 신청을 승인합니다. 이미 승인된 ADMIN이면 같은 응답을 200 OK로 반환하고, 이미 거절된 신청이면 409 Conflict를 반환합니다.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: ADMIN 승인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminApprovalResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /airs/admin/admins/{userId}/reject:
    patch:
      tags:
        - Admin Approval
      summary: ADMIN 신청 거절
      description: 승인된 ROOT_ADMIN이 같은 캠퍼스의 PENDING ADMIN 신청을 거절합니다. 이미 거절된 신청이면 같은 응답을 200 OK로 반환하고, 이미 승인된 ADMIN이면 409 Conflict를 반환합니다.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: ADMIN 신청 거절 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminApprovalResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /airs/admin/campuses:
    post:
      tags:
        - Campus
      summary: 관리자용 캠퍼스 등록
      description: 승인된 ADMIN 또는 ROOT_ADMIN만 새 캠퍼스를 추가할 수 있습니다. USER는 호출할 수 없습니다.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreateCampusRequest'
      responses:
        '201':
          description: 캠퍼스 등록 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /airs/admin/campuses/{campusId}/buildings:
    get:
      tags:
        - Campus
      summary: 관리자용 건물 목록 조회
      description: 노드 등록 화면에서 학교 선택 후 건물 목록을 조회합니다. 승인된 ADMIN 또는 ROOT_ADMIN만 호출할 수 있습니다.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CampusId'
      responses:
        '200':
          description: 건물 목록 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminBuildingResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 요청한 캠퍼스를 찾을 수 없거나 삭제되었습니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
    post:
      tags:
        - Campus
      summary: 관리자용 건물 등록
      description: 승인된 ADMIN 또는 ROOT_ADMIN이 자신의 캠퍼스에 건물을 추가합니다.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CampusId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreateBuildingRequest'
      responses:
        '201':
          description: 건물 등록 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBuildingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /airs/admin/buildings/{buildingId}/spaces:
    get:
      tags:
        - Campus
      summary: 관리자용 공간 목록 조회
      description: 노드 등록 화면에서 건물 선택 후 공간 목록을 조회합니다. 승인된 ADMIN 또는 ROOT_ADMIN만 호출할 수 있습니다.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BuildingId'
      responses:
        '200':
          description: 공간 목록 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminSpaceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
        - Campus
      summary: 관리자용 공간 등록
      description: 노드 등록 화면의 새 공간 추가 버튼에서 사용합니다. 승인된 ADMIN 또는 ROOT_ADMIN만 자신의 캠퍼스 건물에 공간을 추가할 수 있습니다.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BuildingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreateSpaceRequest'
      responses:
        '201':
          description: 공간 등록 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSpaceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /airs/admin/nodes:
    get:
      tags:
        - Admin Nodes
      summary: 관리자 노드 목록 조회
      description: 관리자 앱 노드 관리 화면을 위한 목록 API입니다. 승인된 ADMIN 또는 ROOT_ADMIN만 호출할 수 있습니다.
      security:
        - bearerAuth: []
      parameters:
        - name: sort
          in: query
          required: false
          description: 노드 목록 정렬 기준
          schema:
            type: string
            enum:
              - distance
              - status
              - space
              - alert
            default: distance
      responses:
        '200':
          description: 노드 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminNodeListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /airs/admin/nodes/{nodeId}:
    get:
      tags:
        - Admin Nodes
      summary: 관리자 노드 상세 조회
      description: 관리자 앱 노드 상세 화면을 위한 API입니다. 승인된 ADMIN 또는 ROOT_ADMIN만 호출할 수 있습니다.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NodeId'
      responses:
        '200':
          description: 노드 상세 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminNodeDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Admin Nodes
      summary: 관리자 노드 삭제
      description: 물리 노드 row를 삭제하지 않고 active installation을 비활성화합니다. 삭제한 노드에 연결된 ACTIVE 알림은 자동으로 RESOLVED 처리합니다.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NodeId'
      responses:
        '204':
          description: 노드 삭제 성공
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /airs/admin/nodes/{nodeId}/co2-trend:
    get:
      tags:
        - Admin Nodes
      summary: 관리자 노드 CO2 추이 조회
      description: >
        InfluxDB의 telemetry co2_ppm 시계열을 집계하여 노드 상세 그래프에 반환합니다.
        호출 방식은 두 가지입니다. period=1d|5d|1mo|6mo|1y를 지정하면 기간별 기본 집계 간격을
        사용합니다(1d=10m, 5d=1h, 1mo=6h, 6mo=1d, 1y=1d). period를 생략하면 최근 hours시간을
        window 간격으로 집계합니다(기본 hours=6, window=5m). period와 hours/window를 함께 보내도
        오류가 나지 않으며, period가 우선되어 hours와 window는 무시됩니다. 예를 들어
        period=5d&hours=6&window=30s 요청은 최근 5일을 1시간 단위로 반환합니다. 6mo와 1y는
        완료된 날짜의 sensor_rollup_1d 집계를 우선 읽고, 오늘 또는 집계 공백은 raw telemetry로 보완합니다.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NodeId'
        - name: period
          in: query
          required: false
          description: >
            프리셋 기간 모드입니다. 지정 시 hours/window보다 우선하며, 1d=10m, 5d=1h,
            1mo=6h, 6mo=1d, 1y=1d 기본 집계 간격을 사용합니다. 예: period=5d.
          schema:
            type: string
            enum:
              - 1d
              - 5d
              - 1mo
              - 6mo
              - 1y
            example: 5d
        - name: hours
          in: query
          required: false
          description: >
            사용자 정의 최근 시간 모드입니다. period를 생략했을 때만 사용하며 1~24만 허용합니다.
            window와 함께 사용합니다. 둘 다 생략하면 최근 6시간을 기본 5분 단위로 반환합니다.
          schema:
            type: integer
            minimum: 1
            maximum: 24
            default: 6
        - name: window
          in: query
          required: false
          description: >
            사용자 정의 최근 시간 모드의 Flux aggregateWindow 간격입니다. period를 생략했을 때만
            사용합니다. 예: hours=6&window=5m. 허용 형식은 숫자 뒤에 s, m, h, d가 붙는 값입니다.
          schema:
            type: string
            default: 5m
            example: 5m
      responses:
        '200':
          description: CO2 추이 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminNodeCo2TrendResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /airs/admin/nodes/{nodeId}/sensor-trend:
    get:
      tags:
        - Admin Nodes
      summary: 관리자 노드 선택 센서 추이 조회
      description: >
        노드 상세의 온도·습도·CO2·재실·Comfort Score 카드가 선택한 지표 하나만 반환합니다. metric과 period는 모두 필수입니다.
        1d는 raw sensor_data를 10분 평균으로 읽고, 5d는 sensor_rollup_1h의 1시간 평균을 우선 사용합니다.
        1mo는 1시간 rollup을 count 가중 6시간 평균으로 묶으며, 6mo와 1y는 sensor_rollup_1d의 일 평균을 우선 사용합니다.
        필요한 rollup이 없거나 날짜·시간 중간에 공백이 있거나 조회에 실패하면 같은 기간의 raw telemetry로 전체 fallback합니다.
        occupancy는 occupancy_present의 평균으로, 0은 비재실·1은 재실·0.4는 해당 구간 표본의 약 40%가 재실이라는 뜻입니다.
        comfort는 10분 평가가 끝난 시각에 기록한 0~100점이며, 배포 후 평가 이력이 생기기 전에는 points가 비어 있을 수 있습니다.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NodeId'
        - name: metric
          in: query
          required: true
          description: 그래프로 조회할 단일 센서 또는 평가 지표입니다.
          schema:
            type: string
            enum:
              - temperature
              - humidity
              - co2
              - occupancy
              - comfort
            example: temperature
        - name: period
          in: query
          required: true
          description: >
            노드 상세의 고정 기간입니다. 1d=10m, 5d=1h, 1mo=6h, 6mo=1d, 1y=1d 집계 간격을 사용합니다.
          schema:
            type: string
            enum:
              - 1d
              - 5d
              - 1mo
              - 6mo
              - 1y
            example: 1mo
      responses:
        '200':
          description: 선택 센서 추이 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminNodeSensorTrendResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /airs/admin/alerts:
    get:
      tags:
        - Admin Alerts
      summary: 관리자 알림·조치 목록 조회
      description: >
        승인된 ADMIN 또는 ROOT_ADMIN이 자신의 캠퍼스 알림 lifecycle을 조회합니다.
        status=ACTIVE는 아직 조건이 유지되는 알림, status=RESOLVED는 조건이 정상화되어 자동 해결된 이력입니다.
        수동 미확인·조치중 상태는 현재 지원하지 않습니다.
        화면에 노출하는 유형은 VENTILATION_RECOMMENDED, CO2_RAPID_RISE, WEAK_WIFI이며,
        INFO 심각도는 실제 telemetry의 wifi_signal_dbm으로 만든 WEAK_WIFI에만 사용합니다.
        CO2_RAPID_RISE는 CO2가 801~1000ppm이고 최근 10분에 100ppm 이상 상승할 때 WARNING으로 생성됩니다.
        같은 알림은 CO2 801~1000ppm 및 상승폭 50ppm 초과인 동안 갱신되고, 상승폭이 50ppm 이하가 되거나 CO2 구간을 벗어나면 자동 해결됩니다.
        WEAK_WIFI는 RSSI가 -76dBm 이하일 때 INFO로 생성되고, -73dBm 초과로 회복되면 자동 해결됩니다.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: 조회할 lifecycle 탭입니다. 기본값은 ACTIVE입니다.
          schema:
            $ref: '#/components/schemas/AlertStatus'
            default: ACTIVE
        - name: limit
          in: query
          required: false
          description: 최근 감지 순으로 반환할 최대 행 수입니다.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: 알림·조치 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAlertListResponse'
              example:
                requestedStatus: ACTIVE
                activeCount: 1
                emergencyCount: 0
                warningCount: 1
                infoCount: 0
                resolvedCount: 4
                alerts:
                  - alertId: 42
                    alertType: CO2_RAPID_RISE
                    severity: WARNING
                    status: ACTIVE
                    nodeId: node_01
                    spaceId: 301
                    spaceCode: K301
                    spaceName: 301호
                    buildingName: 김대건관
                    title: CO2 급상승 감지
                    message: 10분 동안 CO2가 105ppm 상승했습니다. 현재 925ppm이므로 환기를 권장합니다.
                    metricName: co2_rate_10m
                    metricValue: 105.0
                    metricUnit: ppm/10min
                    startedAt: '2026-07-27T14:10:00'
                    lastDetectedAt: '2026-07-27T14:20:00'
                    resolvedAt: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /airs/admin/alerts/dashboard:
    get:
      tags:
        - Admin Alerts
      summary: 관리자 알림·조치 화면 대시보드 조회
      description: >
        알림·조치 화면의 lifecycle 탭, 긴급·주의·정보·완료 요약, 주요 알림, 최근 알림 목록을 한 번에 반환합니다.
        전체는 ACTIVE와 RESOLVED의 합계, 활성은 ACTIVE, 완료는 RESOLVED입니다.
        주요 알림은 아직 해결되지 않은 알림을 EMERGENCY, WARNING, INFO 순서와 마지막 감지 시각 내림차순으로 최대 3건 반환합니다.
        최근 알림은 선택 lifecycle 범위에서 ACTIVE는 lastDetectedAt, RESOLVED는 resolvedAt 기준의 시간순으로 최대 4건 반환합니다.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: 최근 알림 목록에 적용할 lifecycle 범위입니다. 완료 탭에서는 주요 알림이 비어 있습니다.
          schema:
            $ref: '#/components/schemas/AdminAlertDashboardStatus'
            default: ALL
      responses:
        '200':
          description: 알림·조치 대시보드 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAlertDashboardResponse'
              example:
                selectedStatus: ALL
                totalCount: 3
                activeCount: 2
                emergencyCount: 0
                warningCount: 1
                infoCount: 1
                resolvedCount: 1
                majorAlerts:
                  - alertId: 42
                    alertType: CO2_RAPID_RISE
                    severity: WARNING
                    status: ACTIVE
                    nodeId: node_01
                    spaceCode: K301
                    spaceName: 301호
                    buildingName: 김대건관
                    title: CO2 급상승 감지
                    message: 10분 동안 CO2가 105ppm 상승했습니다. 현재 925ppm이므로 환기를 권장합니다.
                    metricName: co2_rate_10m
                    metricValue: 105.0
                    metricUnit: ppm/10min
                    startedAt: '2026-07-27T14:10:00'
                    lastDetectedAt: '2026-07-27T14:20:00'
                    resolvedAt: null
                recentAlerts: []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /airs/admin/analytics/co2/summary:
    get:
      tags:
        - Admin Analytics
      summary: 관리자 환기/CO2 요약 카드 조회
      description: 환기/CO2 분석 화면 상단의 환기 양호, 환기 권장, 환기 필요, 데이터 없음 카드만 빠르게 조회합니다. InfluxDB 시간대별 추이 조회는 수행하지 않습니다.
      security:
        - bearerAuth: []
      parameters:
        - name: date
          in: query
          required: false
          description: 조회 기준 날짜입니다. 생략하면 서버 기준 오늘 날짜를 사용합니다.
          schema:
            type: string
            format: date
            example: '2026-07-07'
      responses:
        '200':
          description: 환기/CO2 요약 카드 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCo2SummaryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /airs/admin/analytics/co2/distribution:
    get:
      tags:
        - Admin Analytics
      summary: 관리자 CO2 평균 농도 분포 조회
      description: 환기/CO2 분석 화면의 CO2 평균 농도 분포만 빠르게 조회합니다. 응답 항목의 unit은 SPACE이며 totalCount는 분모로 사용한 전체 공간 수입니다.
      security:
        - bearerAuth: []
      parameters:
        - name: date
          in: query
          required: false
          description: 조회 기준 날짜입니다. 생략하면 서버 기준 오늘 날짜를 사용합니다.
          schema:
            type: string
            format: date
            example: '2026-07-07'
      responses:
        '200':
          description: CO2 평균 농도 분포 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCo2DistributionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /airs/admin/analytics/co2/trend:
    get:
      tags:
        - Admin Analytics
      summary: 관리자 오늘/어제 CO2 시간대별 평균 추이 조회
      description: 분석 요약과 환기/CO2 분석 화면이 공통으로 사용하는 오늘/어제 CO2 평균 추이 그래프를 한 번에 조회합니다. 서버는 기준일 전날부터 기준일 종료까지 48시간 범위를 InfluxDB에 한 번 조회한 뒤, Asia/Seoul 날짜 경계로 todayTrend와 yesterdayTrend를 분리합니다. 두 배열은 각각 1시간 단위 평균입니다.
      security:
        - bearerAuth: []
      parameters:
        - name: date
          in: query
          required: false
          description: 조회 기준 날짜입니다. 생략하면 서버 기준 오늘 날짜를 사용합니다.
          schema:
            type: string
            format: date
            example: '2026-07-07'
      responses:
        '200':
          description: 환기/CO2 시간대별 평균 추이 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCo2TrendResponse'
              example:
                campusId: 1
                campusName: 서강대학교
                date: '2026-07-07'
                todayTrend:
                  - timestamp: '2026-07-07T00:00:00Z'
                    co2Ppm: 612
                  - timestamp: '2026-07-07T01:00:00Z'
                    co2Ppm: 680
                  - timestamp: '2026-07-07T02:00:00Z'
                    co2Ppm: 842
                yesterdayTrend:
                  - timestamp: '2026-07-06T00:00:00Z'
                    co2Ppm: 590
                  - timestamp: '2026-07-06T01:00:00Z'
                    co2Ppm: 640
                  - timestamp: '2026-07-06T02:00:00Z'
                    co2Ppm: 700
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /airs/admin/analytics/co2/top-spaces:
    get:
      tags:
        - Admin Analytics
      summary: 관리자 CO2 Top 5 공간 조회
      description: 환기/CO2 분석 화면의 CO2 Top 5 공간 목록만 빠르게 조회합니다. InfluxDB 시간대별 추이 조회는 수행하지 않습니다.
      security:
        - bearerAuth: []
      parameters:
        - name: date
          in: query
          required: false
          description: 조회 기준 날짜입니다. 생략하면 서버 기준 오늘 날짜를 사용합니다.
          schema:
            type: string
            format: date
            example: '2026-07-07'
      responses:
        '200':
          description: CO2 Top 5 공간 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCo2TopSpacesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /airs/admin/analytics/overview/metrics:
    get:
      tags:
        - Admin Analytics
      summary: 관리자 분석 요약 핵심 지표 조회
      description: 분석 요약 화면의 핵심 지표 카드만 빠르게 조회합니다. InfluxDB 시간대별 추이 조회는 수행하지 않습니다.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 핵심 지표 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAnalyticsOverviewMetricsResponse'
        '401':
