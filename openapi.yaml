openapi: 3.0.3
info:
  title: AIRS Backend API
  version: v2
  description: AIRS backend API definition for mobile/admin app and sensor ingestion query.
servers:
  - url: https://airs.bibnear.cloud
    description: Production API via Caddy HTTPS reverse proxy
  - url: http://localhost:8080
    description: Local development API
tags:
  - name: Auth
    description: 회원가입 및 로그인 API
  - name: Campus
    description: 회원가입/등록 화면에서 사용하는 학교/공간 조회 API
  - name: User
    description: 현재 로그인 사용자 정보 API
  - name: Admin Approval
    description: ROOT_ADMIN의 관리자 승인 API
  - name: Admin Nodes
    description: 관리자 앱 노드 목록, 상세, 등록, 삭제 API
  - name: Admin Analytics
    description: 관리자 앱 분석 요약 및 환기/CO2 분석 API
  - name: Sensor
    description: 인증 사용자가 조회하는 센서 요약 API
  - name: Health
    description: 배포 상태를 확인하는 무인증 health API
paths:
  /actuator/health:
    get:
      tags:
        - Health
      summary: Health check
      description: Docker healthcheck, liveness probe, monitoring tool이 인증 없이 호출할 수 있습니다.
      responses:
        '200':
          description: 서버 상태 조회 성공
  /actuator/info:
    get:
      tags:
        - Health
      summary: Application info
      description: 인증 없이 호출 가능한 actuator info endpoint입니다.
      responses:
        '200':
          description: 애플리케이션 정보 조회 성공

  /airs/health:
    get:
      tags:
        - Health
      summary: Public health check
      description: Caddy를 거쳐 Spring API에 도달할 수 있는지 확인하는 외부 무인증 endpoint입니다. 데이터베이스, InfluxDB, MQTT 연결 상태까지 검사하지는 않습니다.
      responses:
        '200':
          description: Spring API 응답 가능
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicHealthResponse'

  /airs/auth/signup:
    post:
      tags:
        - Auth
      summary: 회원가입
      description: USER 또는 ADMIN 계정을 생성합니다. ROOT_ADMIN은 일반 회원가입으로 생성할 수 없습니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: 회원가입 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignUpResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /airs/auth/login:
    post:
      tags:
        - Auth
      summary: 로그인
      description: 이메일/로그인 ID와 비밀번호로 JWT access token을 발급합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /airs/campuses:
    get:
      tags:
        - Campus
      summary: 캠퍼스 목록 조회
      description: 회원가입 화면에서 학교 선택에 사용합니다. 인증이 필요하지 않습니다.
      responses:
        '200':
          description: 캠퍼스 목록 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CampusResponse'

  /airs/users/me:
    get:
      tags:
        - User
      summary: 내 정보 조회
      description: 'Authorization: Bearer {accessToken} 헤더가 필요합니다.'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /airs/admin/admins/pending:
    get:
      tags:
        - Admin Approval
      summary: 관리자 승인 대기 목록 조회
      description: 승인된 ROOT_ADMIN이 같은 캠퍼스에서 ADMIN으로 가입했지만 아직 승인되지 않은 사용자 목록을 조회합니다.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 관리자 승인 대기 목록 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminPendingApprovalResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 요청한 캠퍼스를 찾을 수 없거나 삭제되었습니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /airs/admin/admins/{userId}/approve:
    patch:
      tags:
        - Admin Approval
      summary: ADMIN 승인
      description: 승인된 ROOT_ADMIN이 같은 캠퍼스의 PENDING ADMIN 신청을 승인합니다. 이미 승인된 ADMIN이면 같은 응답을 200 OK로 반환하고, 이미 거절된 신청이면 409 Conflict를 반환합니다.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: ADMIN 승인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminApprovalResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /airs/admin/admins/{userId}/reject:
    patch:
      tags:
        - Admin Approval
      summary: ADMIN 신청 거절
      description: 승인된 ROOT_ADMIN이 같은 캠퍼스의 PENDING ADMIN 신청을 거절합니다. 이미 거절된 신청이면 같은 응답을 200 OK로 반환하고, 이미 승인된 ADMIN이면 409 Conflict를 반환합니다.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: ADMIN 신청 거절 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminApprovalResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /airs/admin/campuses:
    post:
      tags:
        - Campus
      summary: 관리자용 캠퍼스 등록
      description: 승인된 ADMIN 또는 ROOT_ADMIN만 새 캠퍼스를 추가할 수 있습니다. USER는 호출할 수 없습니다.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreateCampusRequest'
      responses:
        '201':
          description: 캠퍼스 등록 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /airs/admin/campuses/{campusId}/buildings:
    get:
      tags:
        - Campus
      summary: 관리자용 건물 목록 조회
      description: 노드 등록 화면에서 학교 선택 후 건물 목록을 조회합니다. 승인된 ADMIN 또는 ROOT_ADMIN만 호출할 수 있습니다.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CampusId'
      responses:
        '200':
          description: 건물 목록 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminBuildingResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 요청한 캠퍼스를 찾을 수 없거나 삭제되었습니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
    post:
      tags:
        - Campus
      summary: 관리자용 건물 등록
      description: 승인된 ADMIN 또는 ROOT_ADMIN이 자신의 캠퍼스에 건물을 추가합니다.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CampusId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreateBuildingRequest'
      responses:
        '201':
          description: 건물 등록 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBuildingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /airs/admin/buildings/{buildingId}/spaces:
    get:
      tags:
        - Campus
      summary: 관리자용 공간 목록 조회
      description: 노드 등록 화면에서 건물 선택 후 공간 목록을 조회합니다. 승인된 ADMIN 또는 ROOT_ADMIN만 호출할 수 있습니다.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BuildingId'
      responses:
        '200':
          description: 공간 목록 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminSpaceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
        - Campus
      summary: 관리자용 공간 등록
      description: 노드 등록 화면의 새 공간 추가 버튼에서 사용합니다. 승인된 ADMIN 또는 ROOT_ADMIN만 자신의 캠퍼스 건물에 공간을 추가할 수 있습니다.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BuildingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreateSpaceRequest'
      responses:
        '201':
          description: 공간 등록 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSpaceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /airs/admin/nodes:
    get:
      tags:
        - Admin Nodes
      summary: 관리자 노드 목록 조회
      description: 관리자 앱 노드 관리 화면을 위한 목록 API입니다. 승인된 ADMIN 또는 ROOT_ADMIN만 호출할 수 있습니다.
      security:
        - bearerAuth: []
      parameters:
        - name: sort
          in: query
          required: false
          description: 노드 목록 정렬 기준
          schema:
            type: string
            enum:
              - distance
              - status
              - space
              - alert
            default: distance
      responses:
        '200':
          description: 노드 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminNodeListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /airs/admin/nodes/{nodeId}:
    get:
      tags:
        - Admin Nodes
      summary: 관리자 노드 상세 조회
      description: 관리자 앱 노드 상세 화면을 위한 API입니다. 승인된 ADMIN 또는 ROOT_ADMIN만 호출할 수 있습니다.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NodeId'
      responses:
        '200':
          description: 노드 상세 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminNodeDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Admin Nodes
      summary: 관리자 노드 삭제
      description: 물리 노드 row를 삭제하지 않고 active installation을 비활성화합니다. 삭제한 노드에 연결된 ACTIVE 알림은 자동으로 RESOLVED 처리합니다.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NodeId'
      responses:
        '204':
          description: 노드 삭제 성공
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /airs/admin/nodes/{nodeId}/co2-trend:
    get:
      tags:
        - Admin Nodes
      summary: 관리자 노드 CO2 추이 조회
      description: >
        InfluxDB의 telemetry co2_ppm 시계열을 집계하여 노드 상세 그래프에 반환합니다.
        호출 방식은 두 가지입니다. period=1d|5d|1mo|6mo|1y를 지정하면 기간별 기본 집계 간격을
        사용합니다(1d=10m, 5d=1h, 1mo=6h, 6mo=1d, 1y=1d). period를 생략하면 최근 hours시간을
        window 간격으로 집계합니다(기본 hours=6, window=5m). period와 hours/window를 함께 보내도
        오류가 나지 않으며, period가 우선되어 hours와 window는 무시됩니다. 예를 들어
        period=5d&hours=6&window=30s 요청은 최근 5일을 1시간 단위로 반환합니다. 6mo와 1y는
        완료된 날짜의 sensor_rollup_1d 집계를 우선 읽고, 오늘 또는 집계 공백은 raw telemetry로 보완합니다.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NodeId'
        - name: period
          in: query
          required: false
          description: >
            프리셋 기간 모드입니다. 지정 시 hours/window보다 우선하며, 1d=10m, 5d=1h,
            1mo=6h, 6mo=1d, 1y=1d 기본 집계 간격을 사용합니다. 예: period=5d.
          schema:
            type: string
            enum:
              - 1d
              - 5d
              - 1mo
              - 6mo
              - 1y
            example: 5d
        - name: hours
          in: query
          required: false
          description: >
            사용자 정의 최근 시간 모드입니다. period를 생략했을 때만 사용하며 1~24만 허용합니다.
            window와 함께 사용합니다. 둘 다 생략하면 최근 6시간을 기본 5분 단위로 반환합니다.
          schema:
            type: integer
            minimum: 1
            maximum: 24
            default: 6
        - name: window
          in: query
          required: false
          description: >
            사용자 정의 최근 시간 모드의 Flux aggregateWindow 간격입니다. period를 생략했을 때만
            사용합니다. 예: hours=6&window=5m. 허용 형식은 숫자 뒤에 s, m, h, d가 붙는 값입니다.
          schema:
            type: string
            default: 5m
            example: 5m
      responses:
        '200':
          description: CO2 추이 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminNodeCo2TrendResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /airs/admin/nodes/{nodeId}/sensor-trend:
    get:
      tags:
        - Admin Nodes
      summary: 관리자 노드 선택 센서 추이 조회
      description: >
        노드 상세의 온도·습도·CO2 카드가 선택한 지표 하나만 반환합니다. metric과 period는 모두 필수입니다.
        1d는 raw sensor_data를 10분 평균으로 읽고, 5d는 sensor_rollup_1h의 1시간 평균을 우선 사용합니다.
        1mo는 1시간 rollup을 count 가중 6시간 평균으로 묶으며, 6mo와 1y는 sensor_rollup_1d의 일 평균을 우선 사용합니다.
        필요한 rollup이 없거나 날짜·시간 중간에 공백이 있거나 조회에 실패하면 같은 기간의 raw telemetry로 전체 fallback합니다.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NodeId'
        - name: metric
          in: query
          required: true
          description: 그래프로 조회할 단일 센서 지표입니다.
          schema:
            type: string
            enum:
              - temperature
              - humidity
              - co2
            example: temperature
        - name: period
          in: query
          required: true
          description: >
            노드 상세의 고정 기간입니다. 1d=10m, 5d=1h, 1mo=6h, 6mo=1d, 1y=1d 집계 간격을 사용합니다.
          schema:
            type: string
            enum:
              - 1d
              - 5d
              - 1mo
              - 6mo
              - 1y
            example: 1mo
      responses:
        '200':
          description: 선택 센서 추이 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminNodeSensorTrendResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /airs/admin/analytics/co2/summary:
    get:
      tags:
        - Admin Analytics
      summary: 관리자 환기/CO2 요약 카드 조회
      description: 환기/CO2 분석 화면 상단의 환기 양호, 환기 권장, 환기 필요, 데이터 없음 카드만 빠르게 조회합니다. InfluxDB 시간대별 추이 조회는 수행하지 않습니다.
      security:
        - bearerAuth: []
      parameters:
        - name: date
          in: query
          required: false
          description: 조회 기준 날짜입니다. 생략하면 서버 기준 오늘 날짜를 사용합니다.
          schema:
            type: string
            format: date
            example: '2026-07-07'
      responses:
        '200':
          description: 환기/CO2 요약 카드 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCo2SummaryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /airs/admin/analytics/co2/distribution:
    get:
      tags:
        - Admin Analytics
      summary: 관리자 CO2 평균 농도 분포 조회
      description: 환기/CO2 분석 화면의 CO2 평균 농도 분포만 빠르게 조회합니다. 응답 항목의 unit은 SPACE이며 totalCount는 분모로 사용한 전체 공간 수입니다.
      security:
        - bearerAuth: []
      parameters:
        - name: date
          in: query
          required: false
          description: 조회 기준 날짜입니다. 생략하면 서버 기준 오늘 날짜를 사용합니다.
          schema:
            type: string
            format: date
            example: '2026-07-07'
      responses:
        '200':
          description: CO2 평균 농도 분포 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCo2DistributionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /airs/admin/analytics/co2/trend:
    get:
      tags:
        - Admin Analytics
      summary: 관리자 오늘/어제 CO2 시간대별 평균 추이 조회
      description: 분석 요약과 환기/CO2 분석 화면이 공통으로 사용하는 오늘/어제 CO2 평균 추이 그래프를 한 번에 조회합니다. 서버는 기준일 전날부터 기준일 종료까지 48시간 범위를 InfluxDB에 한 번 조회한 뒤, Asia/Seoul 날짜 경계로 todayTrend와 yesterdayTrend를 분리합니다. 두 배열은 각각 1시간 단위 평균입니다.
      security:
        - bearerAuth: []
      parameters:
        - name: date
          in: query
          required: false
          description: 조회 기준 날짜입니다. 생략하면 서버 기준 오늘 날짜를 사용합니다.
          schema:
            type: string
            format: date
            example: '2026-07-07'
      responses:
        '200':
          description: 환기/CO2 시간대별 평균 추이 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCo2TrendResponse'
              example:
                campusId: 1
                campusName: 서강대학교
                date: '2026-07-07'
                todayTrend:
                  - timestamp: '2026-07-07T00:00:00Z'
                    co2Ppm: 612
                  - timestamp: '2026-07-07T01:00:00Z'
                    co2Ppm: 680
                  - timestamp: '2026-07-07T02:00:00Z'
                    co2Ppm: 842
                yesterdayTrend:
                  - timestamp: '2026-07-06T00:00:00Z'
                    co2Ppm: 590
                  - timestamp: '2026-07-06T01:00:00Z'
                    co2Ppm: 640
                  - timestamp: '2026-07-06T02:00:00Z'
                    co2Ppm: 700
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /airs/admin/analytics/co2/top-spaces:
    get:
      tags:
        - Admin Analytics
      summary: 관리자 CO2 Top 5 공간 조회
      description: 환기/CO2 분석 화면의 CO2 Top 5 공간 목록만 빠르게 조회합니다. InfluxDB 시간대별 추이 조회는 수행하지 않습니다.
      security:
        - bearerAuth: []
      parameters:
        - name: date
          in: query
          required: false
          description: 조회 기준 날짜입니다. 생략하면 서버 기준 오늘 날짜를 사용합니다.
          schema:
            type: string
            format: date
            example: '2026-07-07'
      responses:
        '200':
          description: CO2 Top 5 공간 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCo2TopSpacesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /airs/admin/analytics/overview/metrics:
    get:
      tags:
        - Admin Analytics
      summary: 관리자 분석 요약 핵심 지표 조회
      description: 분석 요약 화면의 핵심 지표 카드만 빠르게 조회합니다. InfluxDB 시간대별 추이 조회는 수행하지 않습니다.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 핵심 지표 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAnalyticsOverviewMetricsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /airs/admin/analytics/overview/status-distributions:
    get:
      tags:
        - Admin Analytics
      summary: 관리자 분석 요약 상태 분포 조회
      description: 분석 요약 화면의 CO2, 연결, 재실, Wi-Fi 상태 분포만 빠르게 조회합니다. CO2/재실은 공간 기준, 연결/Wi-Fi는 노드 기준이며 각 항목의 unit과 totalCount를 함께 반환합니다. InfluxDB 시간대별 추이 조회는 수행하지 않습니다.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 상태 분포 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAnalyticsStatusDistributionsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /airs/admin/nodes/installations:
    post:
      tags:
        - Admin Nodes
      summary: Bluetooth 기반 노드 등록 완료
      description: 앱이 Bluetooth/Wi-Fi 설정 성공을 확인한 뒤 backend에 최종 설치 결과를 저장합니다. Wi-Fi password는 절대 보내지 않습니다.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminNodeRegistrationRequest'
      responses:
        '201':
          description: 새 노드 설치 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminNodeRegistrationResponse'
        '200':
          description: 같은 nodeId와 spaceId의 중복 등록 요청. 기존 설치 결과를 반환합니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminNodeRegistrationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /airs/nodes/{nodeId}/measurements/summary:
    get:
      tags:
        - Sensor
      summary: DHT22 일간 요약 조회
      description: 승인된 ADMIN 또는 ROOT_ADMIN이 자기 캠퍼스 active 노드의 일간 온습도 요약을 조회합니다.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NodeId'
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
            example: 2026-07-02
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyDht22SummaryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Authorization: Bearer {accessToken}'
  parameters:
    NodeId:
      name: nodeId
      in: path
      required: true
      schema:
        type: string
        example: node_01
    CampusId:
      name: campusId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        example: 1
    BuildingId:
      name: buildingId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        example: 1
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        example: 2
  responses:
    BadRequest:
      description: 요청 값이 올바르지 않습니다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Unauthorized:
      description: 인증이 필요하거나 토큰이 유효하지 않습니다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Forbidden:
      description: 접근 권한이 없습니다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    NotFound:
      description: 요청한 리소스를 찾을 수 없습니다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Conflict:
      description: 리소스 상태가 충돌합니다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
  schemas:
    UserRole:
      type: string
      enum:
        - USER
        - ADMIN
        - ROOT_ADMIN
    CampusAdminStatus:
      type: string
      enum:
        - PENDING
        - APPROVED
        - REJECTED
    AdminApprovalStatus:
      type: string
      description: 로그인/회원가입/내 정보 응답에서 사용하는 관리자 승인 상태입니다. 기존 adminApproved보다 명확한 신규 필드입니다.
      enum:
        - NOT_APPLICABLE
        - PENDING
        - APPROVED
        - REJECTED
    ConnectionStatus:
      type: string
      enum:
        - ONLINE
        - WEAK
        - OFFLINE
        - UNKNOWN
    OccupancyStatus:
      type: string
      enum:
        - OCCUPIED
        - UNOCCUPIED
        - UNKNOWN
    SpaceType:
      type: string
      enum:
        - CLASSROOM
        - READING_ROOM
        - LAB
        - OFFICE
        - OTHER
    AlertType:
      type: string
      enum:
        - VENTILATION_RECOMMENDED
        - HVAC_WASTE_SUSPECTED
        - NODE_OFFLINE
        - WEAK_WIFI
        - SENSOR_ABNORMAL
        - INFO
    AlertSeverity:
      type: string
      enum:
        - EMERGENCY
        - WARNING
        - INFO

    SignUpRequest:
      type: object
      required:
        - email
        - password
        - nickname
        - phone
        - campusId
        - role
      properties:
        email:
          type: string
          format: email
          maxLength: 50
          example: user@example.com
        password:
          type: string
          minLength: 8
          maxLength: 30
          description: 영문, 숫자, 특수문자를 모두 포함해야 합니다.
          example: Abcd1234!
        nickname:
          type: string
          minLength: 2
          maxLength: 10
          example: jaeho
        phone:
          type: string
          maxLength: 20
          example: '01012345678'
        campusId:
          type: integer
          format: int64
          example: 1
        role:
          $ref: '#/components/schemas/UserRole'
    SignUpResponse:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        campusId:
          type: integer
          format: int64
        email:
          type: string
        nickname:
          type: string
        phone:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        adminApproved:
          type: boolean
          nullable: true
          description: 기존 호환용 필드입니다. USER는 null, ADMIN은 campus_admins 승인 여부, ROOT_ADMIN은 true입니다. 신규 클라이언트는 adminApprovalStatus를 우선 사용하세요.
        adminApprovalStatus:
          $ref: '#/components/schemas/AdminApprovalStatus'
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          maxLength: 50
          example: user@example.com
          description: 로그인에 사용할 이메일 또는 로그인 ID입니다.
        password:
          type: string
          example: Abcd1234!
    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT access token
        userId:
          type: integer
          format: int64
        campusId:
          type: integer
          format: int64
          nullable: true
        email:
          type: string
        nickname:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        adminApproved:
          type: boolean
          nullable: true
          description: 기존 호환용 필드입니다. USER는 null, ADMIN은 campus_admins 승인 여부, ROOT_ADMIN은 true입니다. 신규 클라이언트는 adminApprovalStatus를 우선 사용하세요.
        adminApprovalStatus:
          $ref: '#/components/schemas/AdminApprovalStatus'
    UserMeResponse:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        campusId:
          type: integer
          format: int64
          nullable: true
        email:
          type: string
        nickname:
          type: string
        phone:
          type: string
          nullable: true
        role:
          $ref: '#/components/schemas/UserRole'
        adminApproved:
          type: boolean
          nullable: true
          description: 기존 호환용 필드입니다. USER는 null, ADMIN은 campus_admins 승인 여부, ROOT_ADMIN은 true입니다. 신규 클라이언트는 adminApprovalStatus를 우선 사용하세요.
        adminApprovalStatus:
          $ref: '#/components/schemas/AdminApprovalStatus'
        createdAt:
          type: string
          format: date-time
    AdminApprovalResponse:
      type: object
      properties:
        userId:
          type: integer
          format: int64
          example: 2
        campusId:
          type: integer
          format: int64
          example: 1
        email:
          type: string
          example: admin@example.com
        nickname:
          type: string
          example: admin
        role:
          $ref: '#/components/schemas/UserRole'
        adminApproved:
          type: boolean
          example: true
        adminStatus:
          $ref: '#/components/schemas/CampusAdminStatus'
    AdminPendingApprovalResponse:
      type: object
      properties:
        userId:
          type: integer
          format: int64
          example: 2
        campusId:
          type: integer
          format: int64
          example: 1
        email:
          type: string
          example: admin-candidate@example.com
        nickname:
          type: string
          example: 관리자후보
        phone:
          type: string
          nullable: true
          example: '01012345678'
        role:
          $ref: '#/components/schemas/UserRole'
        adminApproved:
          type: boolean
          example: false
        adminStatus:
          $ref: '#/components/schemas/CampusAdminStatus'
        createdAt:
          type: string
          format: date-time
          example: '2026-07-09T14:20:00'

    CampusResponse:
      type: object
      properties:
        campusId:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: 서강대학교
    AdminCreateCampusRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 150
          example: 서강대학교
        latitude:
          type: number
          nullable: true
          example: null
        longitude:
          type: number
          nullable: true
          example: null
        radiusMeter:
          type: integer
          nullable: true
          minimum: 1
          example: 500
    AdminCreateBuildingRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 150
          example: 다산관
    AdminBuildingResponse:
      type: object
      properties:
        buildingId:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: 김대건관
    AdminCreateSpaceRequest:
      type: object
      required:
        - code
        - name
      properties:
        code:
          type: string
          maxLength: 40
          example: K302
        name:
          type: string
          maxLength: 150
          example: 302호
        floorLabel:
          type: string
          nullable: true
          maxLength: 50
          example: 3층
        spaceType:
          $ref: '#/components/schemas/SpaceType'
        latitude:
          type: number
          nullable: true
          example: null
        longitude:
          type: number
          nullable: true
          example: null
    AdminSpaceResponse:
      type: object
      properties:
        spaceId:
          type: integer
          format: int64
          example: 1
        code:
          type: string
          example: K301
        name:
          type: string
          example: 301호
        floorLabel:
          type: string
          nullable: true
          example: 3층
        spaceType:
          $ref: '#/components/schemas/SpaceType'

    AdminNodeListResponse:
      type: object
      properties:
        campusId:
          type: integer
          format: int64
        campusName:
          type: string
          example: 서강대학교
        radiusMeter:
          type: integer
          nullable: true
          example: 500
        totalNodeCount:
          type: integer
        onlineNodeCount:
          type: integer
          format: int64
        weakNodeCount:
          type: integer
          format: int64
        offlineNodeCount:
          type: integer
          format: int64
        activeAlertCount:
          type: integer
          format: int64
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/AdminNodeSummaryResponse'
    AdminNodeSummaryResponse:
      type: object
      properties:
        rank:
          type: integer
          example: 1
        nodeId:
          type: string
          example: node_01
        spaceId:
          type: integer
          format: int64
          example: 1
        spaceCode:
          type: string
          example: K301
        spaceName:
          type: string
          example: 301호
        buildingName:
          type: string
          example: 김대건관
        floorLabel:
          type: string
          nullable: true
          example: 3층
        distanceMeter:
          type: integer
          nullable: true
        connectionStatus:
          $ref: '#/components/schemas/ConnectionStatus'
        temperature:
          type: number
          nullable: true
