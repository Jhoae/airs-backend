  /airs/admin/analytics/overview/status-distributions:
    get:
      tags:
        - Admin Analytics
      summary: 관리자 분석 요약 상태 분포 조회
      description: 분석 요약 화면의 CO2, 연결, 재실, Wi-Fi 상태 분포만 빠르게 조회합니다. CO2/재실은 공간 기준, 연결/Wi-Fi는 노드 기준이며 각 항목의 unit과 totalCount를 함께 반환합니다. InfluxDB 시간대별 추이 조회는 수행하지 않습니다.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 상태 분포 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAnalyticsStatusDistributionsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /airs/admin/nodes/installations:
    post:
      tags:
        - Admin Nodes
      summary: Bluetooth 기반 노드 등록 완료
      description: 앱이 Bluetooth/Wi-Fi 설정 성공을 확인한 뒤 backend에 최종 설치 결과를 저장합니다. Wi-Fi password는 절대 보내지 않습니다.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminNodeRegistrationRequest'
      responses:
        '201':
          description: 새 노드 설치 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminNodeRegistrationResponse'
        '200':
          description: 같은 nodeId와 spaceId의 중복 등록 요청. 기존 설치 결과를 반환합니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminNodeRegistrationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /airs/nodes/{nodeId}/measurements/summary:
    get:
      tags:
        - Sensor
      summary: DHT22 일간 요약 조회
      description: 승인된 ADMIN 또는 ROOT_ADMIN이 자기 캠퍼스 active 노드의 일간 온습도 요약을 조회합니다.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NodeId'
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
            example: 2026-07-02
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyDht22SummaryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Authorization: Bearer {accessToken}'
  parameters:
    NodeId:
      name: nodeId
      in: path
      required: true
      schema:
        type: string
        example: node_01
    CampusId:
      name: campusId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        example: 1
    BuildingId:
      name: buildingId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        example: 1
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        example: 2
  responses:
    BadRequest:
      description: 요청 값이 올바르지 않습니다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Unauthorized:
      description: 인증이 필요하거나 토큰이 유효하지 않습니다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Forbidden:
      description: 접근 권한이 없습니다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    NotFound:
      description: 요청한 리소스를 찾을 수 없습니다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Conflict:
      description: 리소스 상태가 충돌합니다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
  schemas:
    UserRole:
      type: string
      enum:
        - USER
        - ADMIN
        - ROOT_ADMIN
    CampusAdminStatus:
      type: string
      enum:
        - PENDING
        - APPROVED
        - REJECTED
    AdminApprovalStatus:
      type: string
      description: 로그인/회원가입/내 정보 응답에서 사용하는 관리자 승인 상태입니다. 기존 adminApproved보다 명확한 신규 필드입니다.
      enum:
        - NOT_APPLICABLE
        - PENDING
        - APPROVED
        - REJECTED
    ConnectionStatus:
      type: string
      enum:
        - ONLINE
        - WEAK
        - OFFLINE
        - UNKNOWN
    OccupancyStatus:
      type: string
      enum:
        - OCCUPIED
        - UNOCCUPIED
        - UNKNOWN
    SpaceType:
      type: string
      enum:
        - CLASSROOM
        - READING_ROOM
        - LAB
        - OFFICE
        - OTHER
    AlertType:
      type: string
      enum:
        - VENTILATION_RECOMMENDED
        - CO2_RAPID_RISE
        - HVAC_WASTE_SUSPECTED
        - NODE_OFFLINE
        - WEAK_WIFI
        - SENSOR_ABNORMAL
        - INFO
    AlertSeverity:
      type: string
      enum:
        - EMERGENCY
        - WARNING
        - INFO
    AlertStatus:
      type: string
      enum:
        - ACTIVE
        - RESOLVED
    AdminAlertDashboardStatus:
      type: string
      description: 알림·조치 화면의 lifecycle 탭 범위입니다.
      enum:
        - ALL
        - ACTIVE
        - RESOLVED

    SignUpRequest:
      type: object
      required:
        - email
        - password
        - nickname
        - phone
        - campusId
        - role
      properties:
        email:
          type: string
          format: email
          maxLength: 50
          example: user@example.com
        password:
          type: string
          minLength: 8
          maxLength: 30
          description: 영문, 숫자, 특수문자를 모두 포함해야 합니다.
          example: Abcd1234!
        nickname:
          type: string
          minLength: 2
          maxLength: 10
          example: jaeho
        phone:
          type: string
          maxLength: 20
          example: '01012345678'
        campusId:
          type: integer
          format: int64
          example: 1
        role:
          $ref: '#/components/schemas/UserRole'
    SignUpResponse:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        campusId:
          type: integer
          format: int64
        email:
          type: string
        nickname:
          type: string
        phone:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        adminApproved:
          type: boolean
          nullable: true
          description: 기존 호환용 필드입니다. USER는 null, ADMIN은 campus_admins 승인 여부, ROOT_ADMIN은 true입니다. 신규 클라이언트는 adminApprovalStatus를 우선 사용하세요.
        adminApprovalStatus:
          $ref: '#/components/schemas/AdminApprovalStatus'
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          maxLength: 50
          example: user@example.com
          description: 로그인에 사용할 이메일 또는 로그인 ID입니다.
        password:
          type: string
          example: Abcd1234!
    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT access token
        userId:
          type: integer
          format: int64
        campusId:
          type: integer
          format: int64
          nullable: true
        email:
          type: string
        nickname:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        adminApproved:
          type: boolean
          nullable: true
          description: 기존 호환용 필드입니다. USER는 null, ADMIN은 campus_admins 승인 여부, ROOT_ADMIN은 true입니다. 신규 클라이언트는 adminApprovalStatus를 우선 사용하세요.
        adminApprovalStatus:
          $ref: '#/components/schemas/AdminApprovalStatus'
    UserMeResponse:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        campusId:
          type: integer
          format: int64
          nullable: true
        email:
          type: string
        nickname:
          type: string
        phone:
          type: string
          nullable: true
        role:
          $ref: '#/components/schemas/UserRole'
        adminApproved:
          type: boolean
          nullable: true
