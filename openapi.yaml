        occupancySummary:
          type: string
          nullable: true
          example: 있음
        alertCount:
          type: integer
          format: int64
        lastUpdatedAt:
          type: string
          format: date-time
          nullable: true
    AdminNodeDetailResponse:
      type: object
      properties:
        nodeId:
          type: string
          example: node_01
        spaceId:
          type: integer
          format: int64
        spaceCode:
          type: string
          example: K301
        spaceName:
          type: string
          example: 301호
        buildingName:
          type: string
          example: 김대건관
        floorLabel:
          type: string
          nullable: true
          example: 3층
        firmwareVersion:
          type: string
          nullable: true
          example: v1.2.3
        installedAt:
          type: string
          format: date-time
          nullable: true
        lastUpdatedAt:
          type: string
          format: date-time
          nullable: true
        connectionStatus:
          $ref: '#/components/schemas/ConnectionStatus'
        wifiRssi:
          type: integer
          nullable: true
