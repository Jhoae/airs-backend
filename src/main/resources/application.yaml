spring:
  application:
    name: backend

  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/airs}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false

