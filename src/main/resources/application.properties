management.endpoints.web.exposure.include=health,info
# 개발 단계에서는 모든 웹 origin의 교차 출처 요청을 허용한다.
airs.cors.allowed-origins=${AIRS_CORS_ALLOWED_ORIGINS:*}
ai.evaluation.scheduler.enabled=${AIRS_AI_EVALUATION_SCHEDULER_ENABLED:true}
ai.evaluation.scheduler.initial-delay-ms=${AIRS_AI_EVALUATION_SCHEDULER_INITIAL_DELAY_MS:60000}
ai.evaluation.scheduler.fixed-delay-ms=${AIRS_AI_EVALUATION_SCHEDULER_FIXED_DELAY_MS:600000}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.flyway.enabled=${AIRS_FLYWAY_ENABLED:true}
spring.data.redis.host=${AIRS_REDIS_HOST:redis}
spring.data.redis.port=${AIRS_REDIS_PORT:6379}
spring.data.redis.connect-timeout=${AIRS_REDIS_CONNECT_TIMEOUT:500ms}
spring.data.redis.timeout=${AIRS_REDIS_TIMEOUT:500ms}
analytics.cache.enabled=${AIRS_ANALYTICS_CACHE_ENABLED:true}
analytics.cache.trend-today-ttl-seconds=${AIRS_ANALYTICS_TREND_TODAY_TTL_SECONDS:30}
analytics.cache.trend-history-ttl-seconds=${AIRS_ANALYTICS_TREND_HISTORY_TTL_SECONDS:1800}
analytics.cache.trend-key-prefix=${AIRS_ANALYTICS_TREND_CACHE_KEY_PREFIX:airs:analytics:co2-trend:v1}
node.sensor-trend.cache.enabled=${AIRS_NODE_SENSOR_TREND_CACHE_ENABLED:true}
node.sensor-trend.cache.ttl-seconds=${AIRS_NODE_SENSOR_TREND_CACHE_TTL_SECONDS:30}
node.sensor-trend.cache.stale-ttl-seconds=${AIRS_NODE_SENSOR_TREND_CACHE_STALE_TTL_SECONDS:60}
node.sensor-trend.cache.key-prefix=${AIRS_NODE_SENSOR_TREND_CACHE_KEY_PREFIX:airs:node:sensor-trend:v1}
node.sensor-trend.cache.load-lock-ttl-seconds=${AIRS_NODE_SENSOR_TREND_CACHE_LOAD_LOCK_TTL_SECONDS:10}
node.sensor-trend.cache.load-lock-renew-interval-millis=${AIRS_NODE_SENSOR_TREND_CACHE_LOAD_LOCK_RENEW_INTERVAL_MILLIS:2500}
node.sensor-trend.cache.load-wait-millis=${AIRS_NODE_SENSOR_TREND_CACHE_LOAD_WAIT_MILLIS:1000}
node.sensor-trend.cache.load-poll-millis=${AIRS_NODE_SENSOR_TREND_CACHE_LOAD_POLL_MILLIS:25}
node.sensor-trend.metrics.enabled=${AIRS_NODE_SENSOR_TREND_METRICS_ENABLED:true}
node.sensor-trend.metrics.report-interval-ms=${AIRS_NODE_SENSOR_TREND_METRICS_REPORT_INTERVAL_MS:300000}
# 같은 노드의 순서를 보존하면서 서로 다른 노드를 병렬 적재할 작업자 수입니다.
sensor.ingestion.worker-count=${AIRS_TELEMETRY_INGESTION_WORKER_COUNT:8}
# 순간 burst를 흡수할 작업자별 telemetry 대기열 크기입니다.
sensor.ingestion.queue-capacity=${AIRS_TELEMETRY_INGESTION_QUEUE_CAPACITY:2000}
# Spring 종료 시 이미 받은 telemetry 처리를 기다릴 최대 시간입니다.
sensor.ingestion.shutdown-await-seconds=${AIRS_TELEMETRY_INGESTION_SHUTDOWN_AWAIT_SECONDS:30}
# MQTT 수신 완료는 MySQL telemetry transaction이 commit된 뒤 직접 ACK합니다.
mqtt.client-id=${AIRS_MQTT_CLIENT_ID:airs-backend-telemetry}
mqtt.subscription-qos=${AIRS_MQTT_SUBSCRIPTION_QOS:1}
# MySQL 장애 중에는 같은 stripe를 bounded backoff로 막아 다음 snapshot이 앞서지 않게 합니다.
sensor.telemetry.reliability.max-future-skew-millis=${AIRS_TELEMETRY_MAX_FUTURE_SKEW_MILLIS:120000}
sensor.telemetry.reliability.mysql-retry-initial-backoff-millis=${AIRS_TELEMETRY_MYSQL_RETRY_INITIAL_BACKOFF_MILLIS:100}
sensor.telemetry.reliability.mysql-retry-maximum-backoff-millis=${AIRS_TELEMETRY_MYSQL_RETRY_MAXIMUM_BACKOFF_MILLIS:5000}
# 운영 기본은 0이며 격리 staging의 commit 후 ACK 전 종료 실험에서만 사용합니다.
sensor.telemetry.reliability.ack-delay-millis=${AIRS_TELEMETRY_ACK_DELAY_MILLIS:0}
# InfluxDB 전달은 durable outbox를 polling하고 blocking write 결과로 완료 여부를 갱신합니다.
sensor.telemetry.reliability.publisher-enabled=${AIRS_TELEMETRY_OUTBOX_PUBLISHER_ENABLED:true}
sensor.telemetry.reliability.publisher-batch-size=${AIRS_TELEMETRY_OUTBOX_BATCH_SIZE:200}
sensor.telemetry.reliability.publisher-poll-interval-millis=${AIRS_TELEMETRY_OUTBOX_POLL_INTERVAL_MILLIS:100}
sensor.telemetry.reliability.publisher-initial-backoff-millis=${AIRS_TELEMETRY_OUTBOX_INITIAL_BACKOFF_MILLIS:1000}
sensor.telemetry.reliability.publisher-maximum-backoff-millis=${AIRS_TELEMETRY_OUTBOX_MAXIMUM_BACKOFF_MILLIS:60000}
sensor.telemetry.reliability.publisher-maximum-retry-count=${AIRS_TELEMETRY_OUTBOX_MAXIMUM_RETRY_COUNT:10}
sensor.telemetry.reliability.publisher-stale-claim-millis=${AIRS_TELEMETRY_OUTBOX_STALE_CLAIM_MILLIS:30000}
sensor.telemetry.reliability.cleanup-enabled=${AIRS_TELEMETRY_OUTBOX_CLEANUP_ENABLED:true}
sensor.telemetry.reliability.cleanup-interval-millis=${AIRS_TELEMETRY_OUTBOX_CLEANUP_INTERVAL_MILLIS:5000}
sensor.telemetry.reliability.completed-retention-millis=${AIRS_TELEMETRY_OUTBOX_COMPLETED_RETENTION_MILLIS:600000}
sensor.telemetry.reliability.dead-retention-millis=${AIRS_TELEMETRY_OUTBOX_DEAD_RETENTION_MILLIS:2592000000}
sensor.telemetry.reliability.cleanup-batch-size=${AIRS_TELEMETRY_OUTBOX_CLEANUP_BATCH_SIZE:2000}
influx.write-batch-size=${INFLUX_WRITE_BATCH_SIZE:500}
influx.write-flush-interval-millis=${INFLUX_WRITE_FLUSH_INTERVAL_MILLIS:1000}
influx.write-buffer-limit=${INFLUX_WRITE_BUFFER_LIMIT:20000}
