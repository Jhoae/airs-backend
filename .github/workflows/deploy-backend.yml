name: Deploy Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: backend-main-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew --no-daemon --max-workers=1 test

  deploy:
    name: Deploy to Raspberry Pi
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Configure SSH
        env:
          AIRS_DEPLOY_HOST: ${{ secrets.AIRS_DEPLOY_HOST }}
          AIRS_DEPLOY_PORT: ${{ secrets.AIRS_DEPLOY_PORT }}
          AIRS_DEPLOY_SSH_KEY: ${{ secrets.AIRS_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          printf '%s\n' "$AIRS_DEPLOY_SSH_KEY" > ~/.ssh/airs_backend_deploy_key
          chmod 600 ~/.ssh/airs_backend_deploy_key

          ssh-keyscan -p "$AIRS_DEPLOY_PORT" "$AIRS_DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Deploy Spring service
        env:
          AIRS_DEPLOY_HOST: ${{ secrets.AIRS_DEPLOY_HOST }}
          AIRS_DEPLOY_PORT: ${{ secrets.AIRS_DEPLOY_PORT }}
          AIRS_DEPLOY_USER: ${{ secrets.AIRS_DEPLOY_USER }}
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/airs_backend_deploy_key \
            -p "$AIRS_DEPLOY_PORT" \
            "$AIRS_DEPLOY_USER@$AIRS_DEPLOY_HOST" \
            'bash -se' <<'REMOTE'
          set -euo pipefail

          cd /home/sogangairs/service/backend
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

          # Git에서 관리하는 운영 compose를 실제 배포 compose에 반영한다.
          cp deploy/raspberry/docker-compose.yml /home/sogangairs/service/compose/docker-compose.yml

          # API와 같은 backend revision의 InfluxDB rollup Task를 반영한다.
          # 이 스크립트는 파생 rollup bucket과 Task만 생성하거나 갱신한다.
          bash deploy/raspberry/influx/upsert-rollup-task.sh

          cd /home/sogangairs/service/compose
          docker compose up -d --build redis spring

          spring_healthy=false
          for attempt in {1..30}; do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              spring_healthy=true
              break
            fi
            sleep 2
          done

          if [[ "${spring_healthy}" != "true" ]]; then
            docker compose ps
            docker logs --tail=200 airs-spring
            exit 1
          fi

          docker compose ps spring

          # 후보 Caddyfile 검증과 Spring 정상 확인 후에만 Git 설정을 bind mount 경로에 반영한다.
          docker compose up -d caddy
          bash /home/sogangairs/service/backend/deploy/raspberry/sync-caddyfile.sh
          REMOTE
